[package]
name = "botdiscord"
version = "1.0.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = "0.12"
songbird = "0.6"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mkv", "mp3", "ogg", "vorbis"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
